<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="ho-t ho-d" font-family="var(--serif)">
<title id="ho-t">Vom Bruch an die Küste</title>
<desc id="ho-d">Ein Flussdiagramm. Links die Steinsorten, die beim Brechen zugleich anfallen: Säulen, Krotzen und Senksteine, Kopf- und Pflastersteine, Kleinschlag und Schotter. Rechts die Abnehmer: Holland und Belgien für Ufer und Deiche, die deutsche Nordseeküste für Häfen, Kanäle und Küstenschutz, die Rheinstädte und das Inland für Straßenpflaster, der Wegebau für Schotter. Säulen und Senksteine gehen auf dem Rhein zu Schiff an die Küsten, Pflaster und Schotter bleiben im Land. Unten die Zahlen eines Betriebs für 1895: 369 346 Tonnen gefördert, 338 556 Tonnen abgeliefert, 160 736 Tonnen auf Lager, auch auf holländischen Lagerplätzen; und der Jahresbedarf Hollands an Säulen nach der Basalt-Actien-Gesellschaft 1893: wenig mehr als 10 000 Doppellader.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Vom Bruch an die Küste</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Was beim Brechen anfiel und wohin es ging, nach Heusler (1897) und der Handelskammer Bonn (1895/96). Schema.</text>
<rect x="40" y="78" width="250" height="44" rx="6" fill="var(--stein)" opacity="0.15" stroke="var(--stein)"/>
<a href="#/text/holland/holland/2"><text x="52" y="98" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Säulen</text></a>
<text x="52" y="115" font-size="11.5" fill="var(--ink2)">lang, glatt, ganz verschifft</text>
<rect x="40" y="152" width="250" height="44" rx="6" fill="var(--stein)" opacity="0.15" stroke="var(--stein)"/>
<a href="#/text/holland/gesellschaft/2"><text x="52" y="172" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Krotzen, Senksteine</text></a>
<text x="52" y="189" font-size="11.5" fill="var(--ink2)">Brocken für den Wasserbau</text>
<rect x="40" y="226" width="250" height="44" rx="6" fill="var(--stein)" opacity="0.15" stroke="var(--stein)"/>
<a href="#/text/holland/holland/2"><text x="52" y="246" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Kopf- und Pflastersteine</text></a>
<text x="52" y="263" font-size="11.5" fill="var(--ink2)">behauen</text>
<rect x="40" y="300" width="250" height="44" rx="6" fill="var(--stein)" opacity="0.15" stroke="var(--stein)"/>
<a href="#/text/holland/syndikat/2"><text x="52" y="320" text-anchor="start" font-size="13.5" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Kleinschlag, Schotter</text></a>
<text x="52" y="337" font-size="11.5" fill="var(--ink2)">„Abfallmaterialien“</text>
<rect x="600" y="78" width="270" height="44" rx="6" fill="var(--sea)" opacity="0.12" stroke="var(--sea)"/>
<a href="#/text/holland/holland/2"><text x="612" y="105" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--sea)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Holland, Belgien: Ufer und Deiche</text></a>
<rect x="600" y="152" width="270" height="44" rx="6" fill="var(--sea)" opacity="0.12" stroke="var(--sea)"/>
<a href="#/text/holland/syndikat/1"><text x="612" y="179" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--sea)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Nordsee: Häfen, Kanäle, Küstenschutz</text></a>
<rect x="600" y="226" width="270" height="44" rx="6" fill="var(--bruch)" opacity="0.12" stroke="var(--bruch)"/>
<a href="#/text/holland/holland/2"><text x="612" y="253" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--bruch)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Rheinstädte, Inland: Straßenpflaster</text></a>
<rect x="600" y="300" width="270" height="44" rx="6" fill="var(--bruch)" opacity="0.12" stroke="var(--bruch)"/>
<a href="#/text/holland/syndikat/2"><text x="612" y="327" text-anchor="start" font-size="12.5" font-weight="bold" fill="var(--bruch)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Wegebau</text></a>
<path d="M 290 100 C 440 100, 450 100, 600 100" fill="none" stroke="var(--sea)" stroke-width="5" opacity="0.55"/>
<path d="M 290 100 C 440 100, 450 174, 600 174" fill="none" stroke="var(--sea)" stroke-width="5" opacity="0.55"/>
<path d="M 290 174 C 440 174, 450 100, 600 100" fill="none" stroke="var(--sea)" stroke-width="5" opacity="0.55"/>
<path d="M 290 174 C 440 174, 450 174, 600 174" fill="none" stroke="var(--sea)" stroke-width="5" opacity="0.55"/>
<path d="M 290 248 C 440 248, 450 248, 600 248" fill="none" stroke="var(--bruch)" stroke-width="3" opacity="0.55"/>
<path d="M 290 322 C 440 322, 450 322, 600 322" fill="none" stroke="var(--bruch)" stroke-width="3" opacity="0.55"/>
<path d="M 290 322 C 440 322, 450 100, 600 100" fill="none" stroke="var(--sea)" stroke-width="5" opacity="0.55"/>
<a href="#/text/holland/holland/1"><text x="445" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="var(--sea)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">auf dem Rhein, zu Schiff</text></a>
<a href="#/text/holland/holland/2"><text x="445" y="362" text-anchor="middle" font-size="12" font-weight="normal" fill="var(--bruch)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">im Land, mit Bahn und Fuhrwerk</text></a>
<line x1="40" y1="418" x2="870" y2="418" stroke="var(--line)"/>
<a href="#/text/holland/gesellschaft/2"><text x="40" y="440" text-anchor="start" font-size="13" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Ein Betrieb, 1895:</text></a>
<text x="40" y="460" font-size="12.5" fill="var(--ink)">gefördert 369 346 t · abgeliefert 338 556 t · auf Lager am Jahresende 160 736 t, „in Deutschland und auf den holländischen Lagerplätzen“</text>
<text x="40" y="478" font-size="12.5" fill="var(--ink)">ca. 950 Arbeiter · im ersten Vierteljahr ruhte die Schifffahrt, im Herbst Niedrigwasser</text>
<a href="#/text/holland/tarif/2"><text x="40" y="506" text-anchor="start" font-size="13" font-weight="bold" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" text-decoration="underline">Hollands Jahresbedarf an Säulen nach der Basalt-Actien-Gesellschaft, 1893:</text></a>
<text x="40" y="526" font-size="12.5" fill="var(--ink)">„wenig mehr als 10 000 Doppellader“, also rund 100 000 Tonnen; die rheinischen Brüche könnten das Doppelte liefern.</text>
</svg>